photos.single{grid-template-columns:1fr}.photos.single img{height:200px}.details{padding:12px 14px}.details p{font-size:13px;color:#5b6c78;line-height:1.45;margin:5px 0}.btn{border:0;background:#0d2534;color:white;padding:11px 14px;border-radius:10px;font-weight:750;cursor:pointer}.outline{background:#fff;color:#0d2534;border:1px solid #b8c3c9}.workrow{display:flex;gap:12px;align-items:center;border-bottom:1px solid #edf0f2;padding:12px 14px}.workrow:last-child{border-bottom:0}.workrow input{width:22px;height:22px;accent-color:#0d2534;flex-shrink:0}.workrow .label{flex:1;min-width:0}.workrow .label strong{display:block}.workrow .label span{color:#647481;font-size:13px}.workrow button{border:0;background:#e9eff2;border-radius:9px;padding:9px;cursor:pointer}.search{width:100%;padding:14px;border-radius:12px;border:1px solid #cbd3d8;font:inherit;margin-bottom:14px}.tagbar{display:flex;gap:7px;overflow:auto;margin:0 0 14px}.tagbar button{white-space:nowrap;border:1px solid #d6dde0;background:#fff;padding:9px 12px;border-radius:18px}.tagbar button.active{background:#0d2534;color:#fff}.modal{position:fixed;inset:0;background:#071821b8;z-index:10;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:650px;max-height:93vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.sheet h2{margin:4px 0 15px}.sheet .photos img{height:230px}.sheet .photos{padding:0}.close{float:right}.logitem{background:white;border-radius:12px;padding:13px;margin-bottom:9px}.field{padding:10px;border:1px solid #cbd3d8;border-radius:9px;width:100%;font:inherit}.loggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.hint{font-size:12px;color:#75828a}.footer{padding:15px;color:#7c898e;font-size:12px;text-align:center}@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}.photos img{height:220px}}</style></head><body><div class="shell"><header><div class="brand">MY HOME GYM</div><small>JOUW FITNESS DRAAIBOEK</small></header><nav class="tabs"><button data-tab="home" onclick="nav('home')">Home</button><button data-tab="workout" onclick="nav('workout')">Training</button><button data-tab="library" onclick="nav('library')">Oefeningen</button><button data-tab="stretch" onclick="nav('stretch')">Stretching</button><button data-tab="log" onclick="nav('log')">Logboek</button></nav><main id="main"></main><div class="footer">MY HOME GYM · Beelden: Free Exercise DB</div></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="modalContent"></div></div><script>const DB={"workouts": {"A": {"title": "Full body A", "time": "45–55 min", "items": [["Dumbbell Bench Press", "3 × 8–12"], ["One-Arm Dumbbell Row", "3 × 10–12/arm"], ["Incline Dumbbell Press", "3 × 8–12"], ["Goblet Squat", "3 × 10–12"], ["Side Lateral Raise", "3 × 12–15"], ["Dumbbell Bicep Curl", "2 × 10–12"], ["Dead Bug", "2 × 8/zijde"]]}, "B": {"title": "Full body B", "time": "45–55 min", "items": [["Dumbbell Shoulder Press", "3 × 8–12"], ["Dumbbell Incline Row", "3 × 10–12"], ["Dumbbell Lunges", "3 × 8/been"], ["Dumbbell Floor Press", "3 × 10–12"], ["Hammer Curls", "3 × 10–12"], ["Lying Triceps Press", "3 × 10–12"], ["Plank", "2 × 30–45 sec"]]}, "C": {"title": "Upper express C", "time": "20 min", "items": [["Dumbbell Bench Press", "2 × 10–12"], ["Dumbbell Incline Row", "2 × 10–12"], ["Side Lateral Raise", "2 × 12–15"], ["Hammer Curls", "2 × 10–12"], ["Lying Triceps Press", "2 × 10–12"]]}, "D": {"title": "Benen, schouders & core D", "time": "45–50 min", "items": [["Goblet Squat", "3 × 10–12"], ["Romanian Deadlift", "3 × 10–12"], ["Dumbbell Rear Lunge", "3 × 8/been"], ["Rear Delt Raise", "3 × 12–15"], ["Standing Calf Raises", "3 × 12–20"], ["Farmers Walk", "3 × 30–45 sec"], ["Plank", "3 × 30–45 sec"]]}, "Borst express": {"title": "Borst express", "time": "15–20 min", "items": [["Dumbbell Bench Press", "3 × 10"], ["Incline Dumbbell Press", "2 × 12"], ["Dumbbell Flyes", "2 × 12"]]}, "Rug express": {"title": "Rug express", "time": "15–20 min", "items": [["One-Arm Dumbbell Row", "3 × 10/arm"], ["Dumbbell Incline Row", "3 × 12"], ["Dumbbell Pullover", "2 × 12"]]}, "Schouders express": {"title": "Schouders express", "time": "15–20 min", "items": [["Dumbbell Shoulder Press", "3 × 10"], ["Side Lateral Raise", "3 × 15"], ["Rear Delt Raise", "2 × 12"]]}, "Armen express": {"title": "Armen express", "time": "15–20 min", "items": [["Hammer Curls", "3 × 12"], ["Lying Triceps Press", "3 × 12"], ["Concentration Curls", "2 × 10/arm"]]}}, "exercises": {"Dumbbell Bench Press": {"name": "Dumbbell Bench Press", "source": "Dumbbell Bench Press", "images": ["images/dumbbell-bench-press-0.webp", "images/dumbbell-bench-press-1.webp"], "muscle": "chest", "tips": ["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.", "Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.", "Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position."]}, "One-Arm Dumbbell Row": {"name": "One-Arm Dumbbell Row", "source": "One-Arm Dumbbell Row", "images": ["images/one-arm-dumbbell-row-0.webp", "images/one-arm-dumbbell-row-1.webp"], "muscle": "middle back", "tips": ["Choose a flat bench and place a dumbbell on each side of it.", "Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.", "Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position."]}, "Incline Dumbbell Press": {"name": "Incline Dumbbell Press", "source": "Incline Dumbbell Press", "images": ["images/incline-dumbbell-press-0.webp", "images/incline-dumbbell-press-1.webp"], "muscle": "chest", "tips": ["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.", "Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.", "Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position."]}, "Goblet Squat": {"name": "Goblet Squat", "source": "Goblet Squat", "images": ["images/goblet-squat-0.webp", "images/goblet-squat-1.webp"], "muscle": "quadriceps", "tips": ["Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.", "Squat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.", "At the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."]}, "Side Lateral Raise": {"name": "Side Lateral Raise", "source": "Side Lateral Raise", "images": ["images/side-lateral-raise-0.webp", "images/side-lateral-raise-1.webp"], "muscle": "shoulders", "tips": ["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.", "While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.", "Lower the dumbbells back down slowly to the starting position as you inhale."]}, "Dumbbell Bicep Curl": {"name": "Dumbbell Bicep Curl", "source": "Dumbbell Bicep Curl", "images": ["images/dumbbell-bicep-curl-0.webp", "images/dumbbell-bicep-curl-1.webp"], "muscle": "biceps", "tips": ["Stand up straight with a dumbbell in each hand at arm's length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.", "Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a brief pause as you squeeze your biceps.", "Then, inhale and slowly begin to lower the dumbbells back to the starting position."]}, "Dead Bug": {"name": "Dead Bug", "source": "Dead Bug", "images": ["images/dead-bug-0.webp", "images/dead-bug-1.webp"], "muscle": "abdominals", "tips": ["Begin lying on your back with your hands extended above you toward the ceiling.", "Bring your feet, knees, and hips up to 90 degrees.", "Exhale hard to bring your ribcage down and flatten your back onto the floor, rotating your pelvis up and squeezing your glutes. Hold this position throughout the movement. This will be your starting position."]}, "Dumbbell Shoulder Press": {"name": "Dumbbell Shoulder Press", "source": "Dumbbell Shoulder Press", "images": ["images/dumbbell-shoulder-press-0.webp", "images/dumbbell-shoulder-press-1.webp"], "muscle": "shoulders", "tips": ["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.", "Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.", "Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position."]}, "Dumbbell Incline Row": {"name": "Dumbbell Incline Row", "source": "Dumbbell Incline Row", "images": ["images/dumbbell-incline-row-0.webp", "images/dumbbell-incline-row-1.webp"], "muscle": "middle back", "tips": ["Using a neutral grip, lean into an incline bench.", "Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. This will be your starting position.", "Retract the shoulder blades and flex the elbows to row the dumbbells to your side."]}, "Dumbbell Lunges": {"name": "Dumbbell Lunges", "source": "Dumbbell Lunges", "images": ["images/dumbbell-lunges-0.webp", "images/dumbbell-lunges-1.webp"], "muscle": "quadriceps", "tips": ["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.", "Step forward with your right leg around 2 feet or so from the foot being left stationary behind and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground.", "Using mainly the heel of your foot, push up and go back to the starting position as you exhale."]}, "Dumbbell Floor Press": {"name": "Dumbbell Floor Press", "source": "Dumbbell Floor Press", "images": ["images/dumbbell-floor-press-0.webp", "images/dumbbell-floor-press-1.webp"], "muscle": "triceps", "tips": ["Lay on the floor holding dumbbells in your hands. Your knees can be bent. Begin with the weights fully extended above you.", "Lower the weights until your upper arm comes in contact with the floor. You can tuck your elbows to emphasize triceps size and strength, or to focus on your chest angle your arms to the side.", "Pause at the bottom, and then bring the weight together at the top by extending through the elbows."]}, "Hammer Curls": {"name": "Hammer Curls", "source": "Hammer Curls", "images": ["images/hammer-curls-0.webp", "images/hammer-curls-1.webp"], "muscle": "biceps", "tips": ["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.", "The palms of the hands should be facing your torso. This will be your starting position.", "Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm."]}, "Lying Triceps Press": {"name": "Lying Triceps Press", "source": "Lying Triceps Press", "images": ["images/lying-triceps-press-0.webp", "images/lying-triceps-press-1.webp"], "muscle": "triceps", "tips": ["Lie on a flat bench with either an e-z bar (my preference) or a straight bar placed on the floor behind your head and your feet on the floor.", "Grab the bar behind you, using a medium overhand (pronated) grip, and raise the bar in front of you at arms length. Tip: The arms should be perpendicular to the torso and the floor. The elbows should be tucked in. This is the starting position.", "As you breathe in, slowly lower the weight until the bar lightly touches your forehead while keeping the upper arms and elbows stationary."]}, "Plank": {"name": "Plank", "source": "Plank", "images": ["images/plank-0.webp", "images/plank-1.webp"], "muscle": "abdominals", "tips": ["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.", "Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."]}, "Romanian Deadlift": {"name": "Romanian Deadlift", "source": "Romanian Deadlift", "images": ["images/romanian-deadlift-0.webp", "images/romanian-deadlift-1.webp"], "muscle": "hamstrings", "tips": ["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.", "Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.", "Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control."]}, "Dumbbell Rear Lunge": {"name": "Dumbbell Rear Lunge", "source": "Dumbbell Rear Lunge", "images": ["images/dumbbell-rear-lunge-0.webp", "images/dumbbell-rear-lunge-1.webp"], "muscle": "quadriceps", "tips": ["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.", "Step backward with your right leg around two feet or so from the left foot and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Tip: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground. Keep the torso upright during the lunge; flexible hip flexors are important. A long lunge emphasizes the Gluteus Maximus; a short lunge emphasizes Quadriceps.", "Push up and go back to the starting position as you exhale. Tip: Use the ball of your feet to push in order to accentuate the quadriceps. To focus on the glutes, press with your heels."]}, "Rear Delt Raise": {"name": "Rear Delt Raise", "source": "Bent Over Dumbbell Rear Delt Raise With Head On Bench", "images": ["images/rear-delt-raise-0.webp", "images/rear-delt-raise-1.webp"], "muscle": "shoulders", "tips": ["Stand up straight while holding a dumbbell in each hand and with an incline bench in front of you.", "While keeping your back straight and maintaining the natural arch of your back, lean forward until your forehead touches the bench in front of you. Let the arms hang in front of you perpendicular to the ground. The palms of your hands should be facing each other and your torso should be parallel to the floor. This will be your starting position.", "Keeping your torso forward and stationary, and the arms straight with a slight bend at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. Caution: avoid swinging the torso or bringing the arms back as opposed to the side."]}, "Standing Calf Raises": {"name": "Standing Calf Raises", "source": "Standing Calf Raises", "images": ["images/standing-calf-raises-0.webp", "images/standing-calf-raises-1.webp"], "muscle": "calves", "tips": ["Adjust the padded lever of the calf raise machine to fit your height.", "Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.", "Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down."]}, "Dumbbell Flyes": {"name": "Dumbbell Flyes", "source": "Dumbbell Flyes", "images": ["images/dumbbell-flyes-0.webp", "images/dumbbell-flyes-1.webp"], "muscle": "chest", "tips": ["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.", "Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.", "With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint."]}, "Dumbbell Pullover": {"name": "Dumbbell Pullover", "source": "Bent-Arm Dumbbell Pullover", "images": ["images/dumbbell-pullover-0.webp", "images/dumbbell-pullover-1.webp"], "muscle": "chest", "tips": ["Place a dumbbell standing up on a flat bench.", "Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.", "Grasp the dumbbell with both hands and hold it straight over your chest with a bend in your arms. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position. Caution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face."]}, "Concentration Curls": {"name": "Concentration Curls", "source": "Concentration Curls", "images": ["images/concentration-curls-0.webp", "images/concentration-curls-1.webp"], "muscle": "biceps", "tips": ["Sit down on a flat bench with one dumbbell in front of you between your legs. Your legs should be spread with your knees bent and feet on the floor.", "Use your right arm to pick the dumbbell up. Place the back of your right upper arm on the top of your inner right thigh. Rotate the palm of your hand until it is facing forward away from your thigh. Tip: Your arm should be extended and the dumbbell should be above the floor. This will be your starting position.", "While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: At the top of the movement make sure that the little finger of your arm is higher than your thumb. This guarantees a good contraction. Hold the contracted position for a second as you squeeze the biceps."]}, "Pushups": {"name": "Pushups", "source": "Pushups", "images": ["images/pushups-0.webp", "images/pushups-1.webp"], "muscle": "chest", "tips": ["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.", "Next, lower yourself downward until your chest almost touches the floor as you inhale.", "Now breathe out and press your upper body back up to the starting position while squeezing your chest."]}, "Bent Over Dumbbell Rear Delt Raise": {"name": "Bent Over Dumbbell Rear Delt Raise", "source": "Bent Over Dumbbell Rear Delt Raise With Head On Bench", "images": ["images/bent-over-dumbbell-rear-delt-raise-0.webp", "images/bent-over-dumbbell-rear-delt-raise-1.webp"], "muscle": "shoulders", "tips": ["Stand up straight while holding a dumbbell in each hand and with an incline bench in front of you.", "While keeping your back straight and maintaining the natural arch of your back, lean forward until your forehead touches the bench in front of you. Let the arms hang in front of you perpendicular to the ground. The palms of your hands should be facing each other and your torso should be parallel to the floor. This will be your starting position.", "Keeping your torso forward and stationary, and the arms straight with a slight bend at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. Caution: avoid swinging the torso or bringing the arms back as opposed to the side."]}, "Dumbbell Squat": {"name": "Dumbbell Squat", "source": "Dumbbell Squat", "images": ["images/dumbbell-squat-0.webp", "images/dumbbell-squat-1.webp"], "muscle": "quadriceps", "tips": ["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).", "Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.", "Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly."]}, "Dumbbell Step Ups": {"name": "Dumbbell Step Ups", "source": "Dumbbell Step Ups", "images": ["images/dumbbell-step-ups-0.webp", "images/dumbbell-step-ups-1.webp"], "muscle": "quadriceps", "tips": ["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).", "Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.", "Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position."]}, "Glute Bridge": {"name": "Glute Bridge", "source": "Barbell Glute Bridge", "images": ["images/glute-bridge-0.webp", "images/glute-bridge-1.webp"], "muscle": "glutes", "tips": ["Begin seated on the ground with a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise. Roll the bar so that it is directly above your hips, and lay down flat on the floor.", "Begin the movement by driving through with your heels, extending your hips vertically through the bar. Your weight should be supported by your upper back and the heels of your feet.", "Extend as far as possible, then reverse the motion to return to the starting position."]}, "Dumbbell Shrug": {"name": "Dumbbell Shrug", "source": "Dumbbell Shrug", "images": ["images/dumbbell-shrug-0.webp", "images/dumbbell-shrug-1.webp"], "muscle": "traps", "tips": ["Stand erect with a dumbbell on each hand (palms facing your torso), arms extended on the sides.", "Lift the dumbbells by elevating the shoulders as high as possible while you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the dumbbells. Only the shoulders should be moving up and down.", "Lower the dumbbells back to the original position."]}, "Arnold Dumbbell Press": {"name": "Arnold Dumbbell Press", "source": "Arnold Dumbbell Press", "images": ["images/arnold-dumbbell-press-0.webp", "images/arnold-dumbbell-press-1.webp"], "muscle": "shoulders", "tips": ["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.", "Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.", "Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement."]}, "Front Dumbbell Raise": {"name": "Front Dumbbell Raise", "source": "Front Dumbbell Raise", "images": ["images/front-dumbbell-raise-0.webp", "images/front-dumbbell-raise-1.webp"], "muscle": "shoulders", "tips": ["Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs. This will be your starting position.", "While maintaining the torso stationary (no swinging), lift the left dumbbell to the front with a slight bend on the elbow and the palms of the hands always facing down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top. Inhale after the second pause.", "Now lower the dumbbell back down slowly to the starting position as you simultaneously lift the right dumbbell."]}, "Standing Dumbbell Triceps Extension": {"name": "Standing Dumbbell Triceps Extension", "source": "Standing Dumbbell Triceps Extension", "images": ["images/standing-dumbbell-triceps-extension-0.webp", "images/standing-dumbbell-triceps-extension-1.webp"], "muscle": "triceps", "tips": ["To begin, stand up with a dumbbell held by both hands. Your feet should be about shoulder width apart from each other. Slowly use both hands to grab the dumbbell and lift it over your head until both arms are fully extended.", "The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hands should be facing up towards the ceiling. This will be your starting position.", "Keeping your upper arms close to your head with elbows in and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step."]}, "Alternate Hammer Curl": {"name": "Alternate Hammer Curl", "source": "Alternate Hammer Curl", "images": ["images/alternate-hammer-curl-0.webp", "images/alternate-hammer-curl-1.webp"], "muscle": "biceps", "tips": ["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.", "The palms of the hands should be facing your torso. This will be your starting position.", "While holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move."]}, "Kettlebell Swing": {"name": "Kettlebell Swing", "source": "One-Arm Kettlebell Swings", "images": ["images/kettlebell-swing-0.webp", "images/kettlebell-swing-1.webp"], "muscle": "hamstrings", "tips": []}, "Side Plank": {"name": "Side Plank", "source": "Side Bridge", "images": ["images/side-plank-0.webp", "images/side-plank-1.webp"], "muscle": "abdominals", "tips": []}, "Cat Stretch": {"name": "Cat Stretch", "source": "Cat Stretch", "images": ["images/cat-stretch-0.webp", "images/cat-stretch-1.webp"], "muscle": "lower back", "tips": ["Position yourself on the floor on your hands and knees.", "Pull your belly in and round your spine, lower back, shoulders, and neck, letting your head drop.", "Hold for 15 seconds."]}, "Kneeling Hip Flexor": {"name": "Kneeling Hip Flexor", "source": "Kneeling Hip Flexor", "images": ["images/kneeling-hip-flexor-0.webp", "images/kneeling-hip-flexor-1.webp"], "muscle": "quadriceps", "tips": ["Kneel on a mat and bring your right knee up so the bottom of your foot is on the floor and extend your left leg out behind you so the top of your foot is on the floor.", "Shift your weight forward until you feel a stretch in your hip. Hold for 15 seconds, then repeat for your other side."]}, "Seated Hamstring": {"name": "Seated Hamstring", "source": "Seated Hamstring", "images": ["images/seated-hamstring-0.webp", "images/seated-hamstring-1.webp"], "muscle": "hamstrings", "tips": ["In a seated position with your legs extended, have your partner stand behind you. Now, lean forward as your partner braces your shoulders with their hands. This will be your starting position.", "Attempt to push your torso back for 10-20 seconds, as your partner prevents any actual movement of your torso.", "Now relax your muscles as your partner increases the stretch by gently pushing your torso forward for 10-20 seconds."]}, "Chest Stretch": {"name": "Chest Stretch", "source": "Behind Head Chest Stretch", "images": ["images/chest-stretch-0.webp", "images/chest-stretch-1.webp"], "muscle": "chest", "tips": ["Sit upright on the floor with your partner behind you.", "Place your hands behind your hand, and push your elbows back as far as you can. Your partner should hold your elbows. This will be your starting position.", "Gently attempt to pull your elbows forward with your hands still behind your head for 10 or more seconds. Your partner should prevent your elbows from moving."]}, "Shoulder Stretch": {"name": "Shoulder Stretch", "source": "Shoulder Stretch", "images": ["images/shoulder-stretch-0.webp", "images/shoulder-stretch-1.webp"], "muscle": "shoulders", "tips": ["Reach your left arm across your body and hold it straight."]}, "All Fours Quad Stretch": {"name": "All Fours Quad Stretch", "source": "All Fours Quad Stretch", "images": ["images/all-fours-quad-stretch-0.webp", "images/all-fours-quad-stretch-1.webp"], "muscle": "quadriceps", "tips": ["Start off on your hands and knees, then lift your leg off the floor and hold the foot with your hand.", "Use your hand to hold the foot or ankle, keeping the knee fully flexed, stretching the quadriceps and hip flexors.", "Focus on extending your hips, thrusting them towards the floor. Hold for 10-20 seconds and then switch sides."]}, "Behind Head Chest Stretch": {"name": "Behind Head Chest Stretch", "source": "Behind Head Chest Stretch", "images": ["images/behind-head-chest-stretch-0.webp", "images/behind-head-chest-stretch-1.webp"], "muscle": "chest", "tips": ["Sit upright on the floor with your partner behind you.", "Place your hands behind your hand, and push your elbows back as far as you can. Your partner should hold your elbows. This will be your starting position.", "Gently attempt to pull your elbows forward with your hands still behind your head for 10 or more seconds. Your partner should prevent your elbows from moving."]}, "Calf Stretch Elbows Against Wall": {"name": "Calf Stretch Elbows Against Wall", "source": "Calf Stretch Elbows Against Wall", "images": ["images/calf-stretch-elbows-against-wall-0.webp", "images/calf-stretch-elbows-against-wall-1.webp"], "muscle": "calves", "tips": ["Stand facing a wall from a couple feet away.", "Lean against the wall, placing your weight on your forearms.", "Attempt to keep your heels on the ground. Hold for 10-20 seconds. You may move further or closer the wall, making it more or less difficult, respectively."]}, "Calf Stretch Hands Against Wall": {"name": "Calf Stretch Hands Against Wall", "source": "Calf Stretch Hands Against Wall", "images": ["images/calf-stretch-hands-against-wall-0.webp", "images/calf-stretch-hands-against-wall-1.webp"], "muscle": "calves", "tips": ["Stand facing a wall from several feet away. Stagger your stance, placing one foot forward.", "Lean forward and rest your hands on the wall, keeping your heel, hip and head in a straight line.", "Attempt to keep your heel on the ground. Hold for 10-20 seconds and then switch sides."]}, "Chair Leg Extended Stretch": {"name": "Chair Leg Extended Stretch", "source": "Chair Leg Extended Stretch", "images": ["images/chair-leg-extended-stretch-0.webp", "images/chair-leg-extended-stretch-1.webp"], "muscle": "hamstrings", "tips": ["Sit upright in a chair and grip the seat on the sides.", "Raise one leg, extending the knee, flexing the ankle as you do so.", "Slowly move that leg outward as far as you can, and then back to the center and down."]}, "Chair Lower Back Stretch": {"name": "Chair Lower Back Stretch", "source": "Chair Lower Back Stretch", "images": ["images/chair-lower-back-stretch-0.webp", "images/chair-lower-back-stretch-1.webp"], "muscle": "lats", "tips": ["Sit upright on a chair.", "Bend to one side with your arm over your head. You can hold onto the chair with your free hand.", "Hold for 10 seconds, and repeat for your other side."]}, "Chair Upper Body Stretch": {"name": "Chair Upper Body Stretch", "source": "Chair Upper Body Stretch", "images": ["images/chair-upper-body-stretch-0.webp", "images/chair-upper-body-stretch-1.webp"], "muscle": "shoulders", "tips": ["Sit on the edge of a chair, gripping the back of it.", "Straighten your arms, keeping your back straight, and pull your upper body forward so you feel a stretch. Hold for 20-30 seconds."]}, "Chest And Front Of Shoulder Stretch": {"name": "Chest And Front Of Shoulder Stretch", "source": "Chest And Front Of Shoulder Stretch", "images": ["images/chest-and-front-of-shoulder-stretch-0.webp", "images/chest-and-front-of-shoulder-stretch-1.webp"], "muscle": "chest", "tips": ["Start off by standing with your legs together, holding a bodybar or a broomstick.", "Take a slightly wider than shoulder width grip on the pole and hold it in front of you with your palms facing down.", "Carefully lift the pole up and behind your head."]}, "Chest Stretch on Stability Ball": {"name": "Chest Stretch on Stability Ball", "source": "Chest Stretch on Stability Ball", "images": ["images/chest-stretch-on-stability-ball-0.webp", "images/chest-stretch-on-stability-ball-1.webp"], "muscle": "chest", "tips": ["Get on your hands and knees next to an exercise ball.", "Place your elbows on top of the ball, keeping your arm out to your side. This will be your starting position.", "Lower your torso towards the floor, keeping your elbow on top of the ball. Hold the stretch for 20-30 seconds, and repeat with the other arm."]}, "Child's Pose": {"name": "Child's Pose", "source": "Child's Pose", "images": ["images/child-s-pose-0.webp", "images/child-s-pose-1.webp"], "muscle": "lower back", "tips": ["Get on your hands and knees, walk your hands in front of you.", "Lower your buttocks down to sit on your heels. Let your arms drag along the floor as you sit back to stretch your entire spine.", "Once you settle onto your heels, bring your hands next to your feet and relax. \"breathe\" into your back. Rest your forehead on the floor. Avoid this position if you have knee problems."]}, "Chin To Chest Stretch": {"name": "Chin To Chest Stretch", "source": "Chin To Chest Stretch", "images": ["images/chin-to-chest-stretch-0.webp", "images/chin-to-chest-stretch-1.webp"], "muscle": "neck", "tips": ["Get into a seated position on the floor.", "Place both hands at the rear of your head, fingers interlocked, thumbs pointing down and elbows pointing straight ahead. Slowly pull your head down to your chest. Hold for 20-30 seconds."]}, "Dancer's Stretch": {"name": "Dancer's Stretch", "source": "Dancer's Stretch", "images": ["images/dancer-s-stretch-0.webp", "images/dancer-s-stretch-1.webp"], "muscle": "lower back", "tips": ["Sit up on the floor.", "Cross your right leg over your left, keeping the knee bent. Your left leg is straight and down on the floor.", "Place your left arm on your right leg and your right hand on the floor."]}, "Dynamic Back Stretch": {"name": "Dynamic Back Stretch", "source": "Dynamic Back Stretch", "images": ["images/dynamic-back-stretch-0.webp", "images/dynamic-back-stretch-1.webp"], "muscle": "lats", "tips": ["Stand with your feet shoulder width apart. This will be your starting position.", "Keeping your arms straight, swing them straight up in front of you 5-10 times, increasing the range of motion each time until your arms are above your head."]}, "Dynamic Chest Stretch": {"name": "Dynamic Chest Stretch", "source": "Dynamic Chest Stretch", "images": ["images/dynamic-chest-stretch-0.webp", "images/dynamic-chest-stretch-1.webp"], "muscle": "chest", "tips": ["Stand with your hands together, arms extended directly in front of you. This will be your starting position.", "Keeping your arms straight, quickly move your arms back as far as possible and back in again, similar to an exaggerated clapping motion. Repeat 5-10 times, increasing speed as you do so."]}, "Groin and Back Stretch": {"name": "Groin and Back Stretch", "source": "Groin and Back Stretch", "images": ["images/groin-and-back-stretch-0.webp", "images/groin-and-back-stretch-1.webp"], "muscle": "adductors", "tips": ["Sit on the floor with your knees bent and feet together.", "Interlock your fingers behind your head. This will be your starting position.", "Curl downwards, bringing your elbows to the inside of your thighs. After a brief pause, return to the starting position with your head up and your back straight. Repeat for 10-20 repetitions."]}, "Hamstring Stretch": {"name": "Hamstring Stretch", "source": "Hamstring Stretch", "images": ["images/hamstring-stretch-0.webp", "images/hamstring-stretch-1.webp"], "muscle": "hamstrings", "tips": ["Lie on your back with one leg extended above you, with the hip at ninety degrees. Keep the other leg flat on the floor.", "Loop a belt, band, or rope over the ball of your foot. This will be your starting position.", "Pull on the belt to create tension in the calves and hamstrings. Hold this stretch for 10-30 seconds, and repeat with the other leg."]}, "IT Band and Glute Stretch": {"name": "IT Band and Glute Stretch", "source": "IT Band and Glute Stretch", "images": ["images/it-band-and-glute-stretch-0.webp", "images/it-band-and-glute-stretch-1.webp"], "muscle": "abductors", "tips": ["Loop a belt, rope, or band around one of your feet, and swing that leg across your body to the opposite side, keeping the leg extended as you lay on the ground. This will be your starting position.", "Keeping your foot off of the floor, pull on the belt, using the tension to pull the toes up. Hold for 10-20 seconds, and repeat on the other side."]}, "Intermediate Groin Stretch": {"name": "Intermediate Groin Stretch", "source": "Intermediate Groin Stretch", "images": ["images/intermediate-groin-stretch-0.webp", "images/intermediate-groin-stretch-1.webp"], "muscle": "hamstrings", "tips": ["Lie on your back with your legs extended. Loop a belt, rope, or band around one of your feet, and swing that leg as far to the side as you can. This will be your starting position.", "Pull gently on the belt to create tension in your groin and hamstring muscles. Hold for 10-20 seconds, and repeat on the other side."]}, "Intermediate Hip Flexor and Quad Stretch": {"name": "Intermediate Hip Flexor and Quad Stretch", "source": "Intermediate Hip Flexor and Quad Stretch", "images": ["images/intermediate-hip-flexor-and-quad-stretch-0.webp", "images/intermediate-hip-flexor-and-quad-stretch-1.webp"], "muscle": "quadriceps", "tips": ["Lie face down on the floor, with a rope, belt, or band looped around one foot.", "Flex the knee and extend the hip of the leg to be stretched, using both hands to pull on the belt. Your knee and your hip should come off of the floor, creating tension in the hip flexors and quadriceps. Hold the stretch for 10-20 seconds, and repeat on the other leg."]}, "Iron Crosses (stretch)": {"name": "Iron Crosses (stretch)", "source": "Iron Crosses (stretch)", "images": ["images/iron-crosses-stretch-0.webp", "images/iron-crosses-stretch-1.webp"], "muscle": "quadriceps", "tips": ["Lie face down on the floor, with your arms extended out to your side, palms pressed to the floor. This will be your starting position.", "To begin, flex one knee and bring that leg across the back of your body, attempting to touch it to the ground near the opposite hand.", "Promptly return the leg to the starting postion, and quickly repeat with the other leg. Continue alternating for 10-20 repetitions."]}, "Kneeling Forearm Stretch": {"name": "Kneeling Forearm Stretch", "source": "Kneeling Forearm Stretch", "images": ["images/kneeling-forearm-stretch-0.webp", "images/kneeling-forearm-stretch-1.webp"], "muscle": "forearms", "tips": ["Start by kneeling on a mat with your palms flat and your fingers pointing back toward your knees.", "Slowly lean back keeping your palms flat on the floor until you feel a stretch in your wrists and forearms. Hold for 20-30 seconds."]}, "Leg-Up Hamstring Stretch": {"name": "Leg-Up Hamstring Stretch", "source": "Leg-Up Hamstring Stretch", "images": ["images/leg-up-hamstring-stretch-0.webp", "images/leg-up-hamstring-stretch-1.webp"], "muscle": "hamstrings", "tips": ["Lie flat on your back, bend one knee, and put that foot flat on the floor to stabilize your spine.", "Extend the other leg in the air. If you're tight, you wont be able to straighten it. That's okay. Extend the knee so that the sole of the lifted foot faces the ceiling (or as close as you can get it).", "Slowly straighten the legs as much as possible and then pull the leg toward your nose. Switch sides."]}, "Middle Back Stretch": {"name": "Middle Back Stretch", "source": "Middle Back Stretch", "images": ["images/middle-back-stretch-0.webp", "images/middle-back-stretch-1.webp"], "muscle": "middle back", "tips": ["Stand so your feet are shoulder width apart and your hands are on your hips.", "Twist at your waist until you feel a stretch. Hold for 10 to 15 seconds, then twist to the other side."]}, "On-Your-Back Quad Stretch": {"name": "On-Your-Back Quad Stretch", "source": "On-Your-Back Quad Stretch", "images": ["images/on-your-back-quad-stretch-0.webp", "images/on-your-back-quad-stretch-1.webp"], "muscle": "quadriceps", "tips": ["Lie on a flat bench or step, and hang one leg and arm over the side.", "Bend the knee and hold the top of the foot. As you do this, be careful not to arch your lower back.", "Pull the belly button to the spine to stay in neutral. Press your foot down and into your hand. To add the hip stretch, lift the hip of the leg you're holding up toward the ceiling."]}, "On Your Side Quad Stretch": {"name": "On Your Side Quad Stretch", "source": "On Your Side Quad Stretch", "images": ["images/on-your-side-quad-stretch-0.webp", "images/on-your-side-quad-stretch-1.webp"], "muscle": "quadriceps", "tips": ["Start off by lying on your right side, with your right knee bent at a 90-degree angle resting on the floor in front of you (this stabilizes the torso).", "Bend your left knee behind you and hold your left foot with your left hand. To stretch your hip flexor, press your left hip forward as you push your left foot back into your hand. Switch sides."]}, "Overhead Stretch": {"name": "Overhead Stretch", "source": "Overhead Stretch", "images": ["images/overhead-stretch-0.webp", "images/overhead-stretch-1.webp"], "muscle": "abdominals", "tips": ["Standing straight up, lace your fingers together and open your palms to the ceiling. Keep your shoulders down as you extend your arms up.", "To create a full torso stretch, pull your tailbone down and stabilize your torso as you do this. Stretch the muscles on both the front and the back of the torso."]}, "Peroneals Stretch": {"name": "Peroneals Stretch", "source": "Peroneals Stretch", "images": ["images/peroneals-stretch-0.webp", "images/peroneals-stretch-1.webp"], "muscle": "calves", "tips": ["In a seated position, loop a belt, rope, or band around one foot. This will be your starting position.", "With the leg extended and the heel off of the ground, pull on the belt so that the foot is inverted, with the inside of the foot being pulled towards you. Hold for 10-20 seconds, and then switch sides."]}, "Posterior Tibialis Stretch": {"name": "Posterior Tibialis Stretch", "source": "Posterior Tibialis Stretch", "images": ["images/posterior-tibialis-stretch-0.webp", "images/posterior-tibialis-stretch-1.webp"], "muscle": "calves", "tips": ["In a seated position, loop a belt, rope, or band around one foot. This will be your starting position.", "With the leg extended and the heel off of the ground, pull on the belt so that the foot is everted, with the outside of the foot being pulled towards you. Hold for 10-20 seconds, and then switch sides."]}, "Quad Stretch": {"name": "Quad Stretch", "source": "Quad Stretch", "images": ["images/quad-stretch-0.webp", "images/quad-stretch-1.webp"], "muscle": "quadriceps", "tips": ["Lay on your side. Loop a belt, rope, or band around your top foot. Flex the knee and extend your hip, attempting to touch your glutes with your foot, and holding the belt with your hands. This will be your starting position.", "With the belt being held over the shoulder or overhead, gently pull to increase the stretch in the quadriceps. Hold for 10-20 seconds, and then switch sides."]}, "Round The World Shoulder Stretch": {"name": "Round The World Shoulder Stretch", "source": "Round The World Shoulder Stretch", "images": ["images/round-the-world-shoulder-stretch-0.webp", "images/round-the-world-shoulder-stretch-1.webp"], "muscle": "shoulders", "tips": ["Stand up straight with your legs together, holding a bodybar or broomstick.", "Hold the pole behind your hips with a wider than shoulder width grip. Your palms should be down and your thumbs facing out.", "Slowly lift your arms up behind your head. Don't force it if it gets hard to lift further."]}, "Runner's Stretch": {"name": "Runner's Stretch", "source": "Runner's Stretch", "images": ["images/runner-s-stretch-0.webp", "images/runner-s-stretch-1.webp"], "muscle": "hamstrings", "tips": ["It's easiest to get into this stretch if you start standing up, put one leg behind you, and slowly lower your torso down to the floor.", "Keep the front heel on the floor (if it lifts up, scoot your other leg further back).", "Place your hands on either side of your front leg. To get more out of this stretch, push your butt up toward the ceiling, and then gradually lower it back toward the floor. You'll Stretch the hip flexor of the back leg and the hamstring and buttocks of the front."]}, "Seated Calf Stretch": {"name": "Seated Calf Stretch", "source": "Seated Calf Stretch", "images": ["images/seated-calf-stretch-0.webp", "images/seated-calf-stretch-1.webp"], "muscle": "calves", "tips": ["Sit up straight on an exercise mat.", "Bend one knee and put that foot on the floor to stabilize the torso.", "Straighten your other leg and flex your ankle."]}, "Seated Floor Hamstring Stretch": {"name": "Seated Floor Hamstring Stretch", "source": "Seated Floor Hamstring Stretch", "images": ["images/seated-floor-hamstring-stretch-0.webp", "images/seated-floor-hamstring-stretch-1.webp"], "muscle": "hamstrings", "tips": ["Sit on a mat with your right leg extended in front of you and your left leg bent with your foot against your right inner thigh.", "Lean forward from your hips and reach for your ankle until you feel a stretch in your hamstring. Hold for 15 seconds, then repeat for your other side."]}, "Seated Hamstring and Calf Stretch": {"name": "Seated Hamstring and Calf Stretch", "source": "Seated Hamstring and Calf Stretch", "images": ["images/seated-hamstring-and-calf-stretch-0.webp", "images/seated-hamstring-and-calf-stretch-1.webp"], "muscle": "hamstrings", "tips": ["Loop a belt, rope, or band around one foot. Sit down with both legs extended . This will be your starting position.", "Leaning forward slightly, pull on the belt to draw the toes of your foot back. Hold this position for 10-20 seconds and then repeat with the other leg."]}, "Side Bridge": {"name": "Side Bridge", "source": "Side Bridge", "images": ["images/side-bridge-0.webp", "images/side-bridge-1.webp"], "muscle": "abdominals", "tips": []}, "Groiners": {"name": "Groiners", "source": "Groiners", "images": ["images/groiners-0.webp", "images/groiners-1.webp"], "muscle": "adductors", "tips": ["Begin in a pushup position on the floor. This will be your starting position.", "Using both legs, jump forward landing with your feet next to your hands. Keep your head up as you do so.", "Return to the starting position and immediately repeat the movement, continuing for 10-20 repetitions."]}, "Hip Circles": {"name": "Hip Circles", "source": "Hip Circles (prone)", "images": ["images/hip-circles-0.webp", "images/hip-circles-1.webp"], "muscle": "abductors", "tips": ["Position yourself on your hands and knees on the ground. Maintaining good posture, raise one bent knee off of the ground. This will be your starting position.", "Keeping the knee in a bent position, rotate the femur in an arc, attempting to make a big circle with your knee.", "Perform this slowly for a number of repetitions, and repeat on the other side."]}, "Lying Glute": {"name": "Lying Glute", "source": "Lying Glute", "images": ["images/lying-glute-0.webp", "images/lying-glute-1.webp"], "muscle": "glutes", "tips": ["Lie on your back with your partner kneeling beside you.", "Flex the hip of one leg, raising it off of the floor. Rotate the leg so the foot is over the opposite hip, the lower leg perpendicular to your body. Your partner should hold the knee and ankle in place. This will be your starting position.", "Attempt to push your leg towards your partner, who should be preventing any actual movement of the leg."]}, "Standing Toe Touches": {"name": "Standing Toe Touches", "source": "Standing Toe Touches", "images": ["images/standing-toe-touches-0.webp", "images/standing-toe-touches-1.webp"], "muscle": "hamstrings", "tips": ["Stand with some space in front and behind you.", "Bend at the waist, keeping your legs straight, until you can relax and let your upper body hang down in front of you. Let your arms and hands hang down naturally. Hold for 10 to 20 seconds."]}, "Knee Across The Body": {"name": "Knee Across The Body", "source": "Knee Across The Body", "images": ["images/knee-across-the-body-0.webp", "images/knee-across-the-body-1.webp"], "muscle": "glutes", "tips": ["Lie down on the floor with your right leg straight. Bend your left leg and lower it across your body, holding the knee down toward the floor with your right hand. (The knee doesn't need to touch the floor if you're tight.)", "Place your left arm comfortably beside you and turn your head to the left. Imagine you have a weight tied to your tailbone. let your tailbone fall back toward the floor as your chest reaches in the opposite direction to stretch your lower back. Switch sides."]}, "Lower Back Curl": {"name": "Lower Back Curl", "source": "Lower Back Curl", "images": ["images/lower-back-curl-0.webp", "images/lower-back-curl-1.webp"], "muscle": "abdominals", "tips": ["Lie on your stomach with your arms out to your sides. This will be your starting position.", "Using your lower back muscles, extend your spine lifting your chest off of the ground. Do not use your arms to push yourself up. Keep your head up during the movement. Repeat for 10-20 repetitions."]}, "Seated Glute": {"name": "Seated Glute", "source": "Seated Glute", "images": ["images/seated-glute-0.webp", "images/seated-glute-1.webp"], "muscle": "glutes", "tips": ["In a seated position with your knees bent, cross one ankle over the opposite knee. Your partner will stand behind you. Now, lean forward as your partner braces your shoulders with their hands. This will be your starting position.", "Attempt to push your torso back for 10-20 seconds, as your partner prevents any actual movement of your torso.", "Now relax your muscles as your partner increases the stretch by gently pushing your torso forward for 10-20 seconds."]}, "Spinal Stretch": {"name": "Spinal Stretch", "source": "Spinal Stretch", "images": ["images/spinal-stretch-0.webp", "images/spinal-stretch-1.webp"], "muscle": "middle back", "tips": ["Sit in a chair so your back is straight and your feet planted on the floor.", "Interlace your fingers behind your head, elbows out and your chin down.", "Twist your upper body to one side about 3 times as far as you can. Then lean forward and twist your torso to reach your elbow to the floor on the inside of your knee."]}}, "stretches": ["Cat Stretch", "Kneeling Hip Flexor", "Seated Hamstring", "Shoulder Stretch", "Behind Head Chest Stretch", "Standing Calf Raises", "Side Bridge", "Groiners", "Hip Circles", "Lying Glute", "Standing Toe Touches", "Knee Across The Body", "Lower Back Curl", "Seated Glute", "Spinal Stretch", "Hamstring Stretch"]};let tab='home',selected='A',filter='',category='Alle';const $=s=>document.querySelector(s);function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}let checks=load('gym-checks',{}),logs=load('gym-logs',[]);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(t){tab=t;render();scrollTo(0,0)}function exercise(n){const e=DB.exercises[n];if(!e)return '';let pics=e.images.map((p,i)=>`<div><img src="${p}" alt="${esc(n)} positie ${i+1}" loading="lazy"><div class="hint" style="text-align:center">Positie ${i+1}</div></div>`).join('');return `<div class="card"><div class="cardhead"><strong>${esc(n)}</strong><span class="pill">${esc(e.muscle)}</span></div><div class="photos ${e.images.length===1?'single':''}">${pics}</div><div class="details"><button class="btn outline" onclick="openExercise('${esc(n).replace(/'/g,'&#39;')}')">Bekijk oefening</button></div></div>`}function openExercise(n){let e=DB.exercises[n];if(!e){alert('Geen passende foto beschikbaar voor deze oefening.');return}$('#modalContent').innerHTML=`<button class="btn outline close" onclick="closeModal()">Sluiten ✕</button><h2>${esc(n)}</h2><div class="photos ${e.images.length===1?'single':''}">${e.images.map((p,i)=>`<img src="${p}" alt="Positie ${i+1}">`).join('')}</div><p class="hint">De foto's tonen twee posities. De volgorde is niet altijd begin/eind.</p><h3>Uitvoering</h3>${e.tips.map(t=>`<p>${esc(t)}</p>`).join('')}<p class="hint">Bron: Free Exercise DB · ${esc(e.source)}</p>`;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}function workoutsList(){return Object.keys(DB.workouts).map(k=>`<button class="tile" onclick="selected='${k}';nav('workout')"><span class="letter">${k.length===1?k:'⚡'}</span><strong>${DB.workouts[k].title}</strong><span class="muted">${DB.workouts[k].time} · ${DB.workouts[k].items.length} oefeningen</span></button>`).join('')}function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let s='';if(tab==='home')s=`<div class="intro"><h1>Wat train je vandaag?</h1><p>Jouw complete homegym, altijd bij de hand.</p></div><div class="content"><div class="grid">${workoutsList()}</div><h2 class="section-title">Snel naar</h2><div class="grid"><button class="tile" onclick="nav('library')"><span class="letter">↗</span><strong>Oefeningen</strong><span class="muted">Foto's en uitvoering</span></button><button class="tile" onclick="nav('stretch')"><span class="letter">◌</span><strong>Stretching</strong><span class="muted">Mobiliteit en herstel</span></button><button class="tile" onclick="nav('log')"><span class="letter">✓</span><strong>Trainingslog</strong><span class="muted">Je eigen notities</span></button></div></div>`;if(tab==='workout'){let w=DB.workouts[selected];s=`<div class="intro"><button class="btn outline" onclick="nav('home')">← Alle workouts</button><h1 style="margin-top:15px">Training ${selected.length===1?selected:''}: ${w.title}</h1><p>${w.time} · Rust 60–90 sec · Tik op een oefening voor foto's.</p></div><div class="content"><div class="card">${w.items.map(([n,r],i)=>`<div class="workrow"><input type="checkbox" aria-label="${esc(n)} voltooid" ${checks[selected+'-'+i]?'checked':''} onchange="checks['${selected}-${i}']=this.checked;store('gym-checks',checks)"><div class="label"><strong>${esc(n)}</strong><span>${r}</span></div><button onclick="openExercise('${esc(n)}')">Foto's ↗</button></div>`).join('')}</div><button class="btn" onclick="saveWorkout()">Training opslaan in logboek</button><button class="btn outline" style="margin-left:8px" onclick="resetWorkout()">Vinkjes wissen</button></div>`}if(tab==='library'){let names=Object.keys(DB.exercises).filter(n=>n.toLowerCase().includes(filter.toLowerCase()));s=`<div class="intro"><h1>Oefenbibliotheek</h1><p>${names.length} oefeningen met echte foto's.</p></div><div class="content"><input class="search" placeholder="Zoek bijvoorbeeld row, squat, curl..." value="${esc(filter)}" oninput="filter=this.value;render();document.querySelector('.search').focus()">${names.map(exercise).join('')}</div>`}if(tab==='stretch'){let names=DB.stretches;s=`<div class="intro"><h1>Stretching & mobiliteit</h1><p>Rustig bewegen, zonder pijn te forceren. Houd een stretch meestal 20–30 seconden aan.</p></div><div class="content">${names.map(exercise).join('')}</div>`}if(tab==='log'){s=`<div class="intro"><h1>Trainingslog</h1><p>Je trainingen worden lokaal op dit toestel bewaard.</p></div><div class="content"><div class="card" style="padding:15px"><label>Eigen notitie</label><textarea class="field" id="note" rows="3" placeholder="Bijvoorbeeld: bench 22 kg × 10, 10, 9"></textarea><button class="btn" style="margin-top:10px" onclick="addNote()">Notitie bewaren</button></div><h2 class="section-title">Geschiedenis</h2>${logs.length?logs.map((l,i)=>`<div class="logitem"><strong>${esc(l.title)}</strong><div class="muted">${esc(l.date)}</div>${l.note?`<p>${esc(l.note)}</p>`:''}</div>`).join(''):'<p>Nog geen trainingen opgeslagen.</p>'}</div>`}$('#main').innerHTML=s}function saveWorkout(){let w=DB.workouts[selected],done=w.items.filter((x,i)=>checks[selected+'-'+i]).length;logs.unshift({title:w.title,date:new Date().toLocaleString('nl-BE'),note:`${done}/${w.items.length} oefeningen afgevinkt`});store('gym-logs',logs);alert('Training opgeslagen!')}function resetWorkout(){DB.workouts[selected].items.forEach((x,i)=>delete checks[selected+'-'+i]);store('gym-checks',checks);render()}function addNote(){let note=$('#note').value.trim();if(!note)return;logs.unshift({title:'Vrije trainingsnotitie',date:new Date().toLocaleString('nl-BE'),note});store('gym-logs',logs);render()}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
